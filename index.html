<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>

    <div id="main">
        <nav></nav>
        <section class="allElems">
            <div class="toDo elem" id="0">
                <img src="https://plus.unsplash.com/premium_photo-1664036937350-4ca5ae06dd4e?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDM0fHx8ZW58MHx8fHx8" alt="">
                <h2>To do list</h2>
            </div>
            <div class="dailyP elem" id="1">
                <img src="https://plus.unsplash.com/premium_photo-1675075213876-574a2a454dba?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDEwNXx8fGVufDB8fHx8fA%3D%3D" alt="">
                <h2>Daily Planner</h2>
            </div>
            <div class="moti elem" id="2">
                <img src="https://plus.unsplash.com/premium_photo-1679260771095-b2409685e004?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDIyMnx8fGVufDB8fHx8fA%3D%3D" alt="">
                <h2>Motivation</h2>
            </div>
            <div class="pomo elem" id="3">
                <img src="https://plus.unsplash.com/premium_photo-1679095251094-3f1f9a8a16f8?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDM0MXx8fGVufDB8fHx8fA%3D%3D" alt="">
                <h2>Pomodoro timer</h2>
            </div>
            <div class="goals elem" id="4">
                <img src="https://plus.unsplash.com/premium_photo-1725556864615-976d92d9fc93?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDQxOHx8fGVufDB8fHx8fA%3D%3D" alt="">
                <h2>Daily goals</h2>
            </div>
        </section>
        <section class="fullElem">
            <button class="back"><i class="ri-close-circle-line"></i></button>
            <h1>To do Page</h1>
        </section>
        <section class="fullElem">
            <button class="back"><i class="ri-close-circle-line"></i></button>
            <h1>Daily planner</h1>
        </section>
        <section class="fullElem">
            <button class="back"><i class="ri-close-circle-line"></i></button>
            <h1>Motivational Quote</h1>
        </section>
        <section class="fullElem">
            <button class="back"><i class="ri-close-circle-line"></i></button>
            <h1>Pomodoro Timer</h1>
        </section>
        <section class="fullElem">
            <button class="back"><i class="ri-close-circle-line"></i></button>
            <h1>Daily Goals</h1>
        </section>

    </div>

    <script src="script.js"></script>
</body>

</html>
